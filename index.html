<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Punk Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="serpiente.css">
</head>
<body>
  <main class="contenedor-juego">
    <header class="encabezado">
      <h1>🐍 SNAKE <span class="destacado">PUNK</span></h1>
      <button id="btnSonido" class="btn-icon" onclick="toggleSonido()" aria-label="Activar o desactivar sonido" title="Sonido">🔊</button>
    </header>
    
    <section class="panel-info">
      <div class="tarjeta-info">
        <span class="label">PUNTOS</span>
        <strong id="puntaje">0</strong>
      </div>
      <div class="tarjeta-info">
        <span class="label">RÉCORD</span>
        <strong id="maxPuntaje">0</strong>
      </div>
      <div class="tarjeta-info">
        <span class="label">ESTADO</span>
        <strong id="estado" class="estado-tag">LISTO</strong>
      </div>
    </section>

    <div class="canvas-wrapper">
      <canvas id="canvasJuego" width="600" height="600"></canvas>
      <div id="overlayJuego" class="overlay hidden">
        <h2 id="overlayTitulo">GAME OVER</h2>
        <p id="overlaySubtitulo">Presiona START o RESET para jugar de nuevo</p>
      </div>
    </div>

    <!-- Controles D-Pad táctiles para móviles y tablets -->
    <section class="controles-tactiles" aria-label="Controles táctiles">
      <div class="vacio"></div>
      <button id="arriba" class="btn-dpad" onclick="cambiarDireccion('arriba')" aria-label="Mover arriba">▲</button>
      <div class="vacio"></div>

      <button id="izquierda" class="btn-dpad" onclick="cambiarDireccion('izquierda')" aria-label="Mover izquierda">◀</button>
      <button id="pausar" class="btn-dpad btn-pausa" onclick="pausarJuego()" aria-label="Pausar o reanudar juego">⏸</button>
      <button id="derecha" class="btn-dpad" onclick="cambiarDireccion('derecha')" aria-label="Mover derecha">▶</button>

      <div class="vacio"></div>
      <button id="abajo" class="btn-dpad" onclick="cambiarDireccion('abajo')" aria-label="Mover abajo">▼</button>
      <div class="vacio"></div>
    </section>

    <!-- Botones de Acción -->
    <section class="acciones">
      <button id="iniciar" class="btn-accion principal" onclick="iniciarJuego()">START</button>
      <button id="reiniciar" class="btn-accion secundario" onclick="reiniciarJuego()">RESET</button>
    </section>

    <footer class="guia-teclas">
      <span>🕹️ Teclas: <b>Flechas</b> / <b>WASD</b> | <b>Espacio/P</b>: Pausa | <b>R</b>: Reiniciar | 📱 <b>Desliza el dedo</b> en móvil</span>
    </footer>
  </main>

  <script src="serpiente.js"></script>
</body>
</html>
